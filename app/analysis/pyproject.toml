[project]
name = "wecom-analysis"
version = "0.1.0"
description = "Analysis pipeline for WeCom archive summaries"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "jieba>=0.42",
  "pymysql>=1.1",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
analysisctl = "analysis_app.cli:app"

[tool.setuptools.packages.find]
include = ["analysis_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../weCom/backend"]
