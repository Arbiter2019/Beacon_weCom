[project]
name = "wecom-archive-service"
version = "0.1.0"
description = "Enterprise WeChat conversation archive service"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13",
  "cryptography>=42",
  "fastapi>=0.111",
  "pydantic-settings>=2.3",
  "pymysql>=1.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5"
]

[project.scripts]
wecomctl = "wecom_app.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
