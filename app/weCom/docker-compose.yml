services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wecom_archive}
      MYSQL_USER: ${MYSQL_USER:-wecom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  wecom-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uvicorn", "wecom_app.main:app", "--host", "0.0.0.0", "--port", "8717"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8717:8717"
    volumes:
      - wecom_attachments:/data/wecom/attachments:ro

  wecom-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "wecom_app.worker"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - wecom_attachments:/data/wecom/attachments
      - ./secrets/wecom_archive_private_key.pem:/run/secrets/wecom_archive_private_key.pem:ro
      - ./vendor/wecom_sdk:/opt/wecom_sdk:ro

  wecom-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_INTERNAL_ADMIN_TOKEN: ${INTERNAL_ADMIN_TOKEN}
    depends_on:
      - wecom-api
    ports:
      - "5173:80"

volumes:
  mysql_data:
  wecom_attachments:
